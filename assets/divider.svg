<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="50" y="11" width="900" height="2" rx="1" fill="url(#l)" opacity="0.5"/>
  <circle cy="12" r="4" fill="#93c5fd">
    <animate attributeName="cx" values="50;950;50" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="6s" repeatCount="indefinite"/>
  </circle>
  <rect x="492" y="6" width="16" height="12" rx="3" fill="#0b1020" stroke="#60a5fa" stroke-width="1.5">
    <animateTransform attributeName="transform" type="rotate" values="0 500 12;180 500 12;360 500 12" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
