<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-label="Unidos construimos más, juntos logramos lo imposible.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <style>.q{font:italic 600 16px ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;fill:#e0f2fe}.s{font:500 12px ui-monospace,Menlo,Consolas,monospace;fill:#93c5fd;letter-spacing:3px}</style>
  </defs>
  <rect width="1000" height="130" rx="16" fill="url(#g)"/>
  <path d="M0 84 C 125 54, 250 114, 375 84 S 625 54, 750 84 S 1000 114, 1125 84 V130 H0Z" fill="#fff" fill-opacity="0.09">
    <animateTransform attributeName="transform" type="translate" values="0 0;-250 0" dur="7s" repeatCount="indefinite"/>
  </path>
  <path d="M0 98 C 125 68, 250 128, 375 98 S 625 68, 750 98 S 1000 128, 1125 98 V130 H0Z" fill="#fff" fill-opacity="0.07">
