  </path>
  <text x="500" y="48" text-anchor="middle" class="q">Unidos construimos más, juntos logramos lo imposible.</text>
  <text x="500" y="72" text-anchor="middle" class="s">ARK DEV · EFFICIENCY &amp; MODERNITY</text>
