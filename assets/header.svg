<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Joel Andrés C. — CEO de ARK DEV, ingeniero Full-Stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#1e3a8a">
        <animate attributeName="stop-color" values="#1e3a8a;#2563eb;#1e3a8a" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#60a5fa" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <style>
      .name{font:700 56px ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace;fill:#fff}
      .tag{font:500 15px ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace;fill:#93c5fd;letter-spacing:3px}
      .sub{font:600 22px ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace;fill:#bfdbfe;opacity:0;animation:cycle 12s infinite}
      .s2{animation-delay:3s}.s3{animation-delay:6s}.s4{animation-delay:9s}
      @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%{opacity:1;transform:translateY(0)}22%{opacity:1;transform:translateY(0)}26%{opacity:0;transform:translateY(-6px)}100%{opacity:0}}
      .cur{fill:#60a5fa;animation:blink 1s steps(2,start) infinite}
      @keyframes blink{to{visibility:hidden}}
    </style>
  </defs>
  <rect width="1000" height="240" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="240" rx="16" fill="url(#grid)"/>
  <circle cx="160" cy="60" r="140" fill="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;520 70;0 0" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="860" cy="190" r="120" fill="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-480 -60;0 0" dur="18s" repeatCount="indefinite"/>
  </circle>
  <text x="500" y="52" text-anchor="middle" class="tag">CEO · ARK DEV</text>
  <text x="500" y="128" text-anchor="middle" class="name">Joel Andrés C.</text>
  <g text-anchor="middle">
    <text x="500" y="178" class="sub">Ingeniero Full-Stack</text>
    <text x="500" y="178" class="sub s2">Integración de IA en aplicaciones web</text>
    <text x="500" y="178" class="sub s3">Ciberseguridad</text>
    <text x="500" y="178" class="sub s4">Fundador &amp; CEO @ ARK DEV</text>
  </g>
  <rect x="496" y="196" width="8" height="3" rx="1.5" class="cur"/>
</svg>
