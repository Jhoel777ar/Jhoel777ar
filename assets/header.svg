<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Joel Andrés C. — CEO de ARK DEV · Ingeniero Full-Stack · Agentes de IA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#14307a">
        <animate attributeName="stop-color" values="#14307a;#2563eb;#4c1d95;#14307a" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#93c5fd">
        <animate attributeName="offset" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#60a5fa" stroke-opacity="0.09"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono{font-family:ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace}
      .tag{font-size:14px;font-weight:600;fill:#93c5fd;letter-spacing:4px}
      .name{font-size:60px;font-weight:800;fill:url(#title)}
      .sub{font-size:21px;font-weight:600;fill:#bfdbfe;opacity:0;animation:cycle 15s infinite}
      .s2{animation-delay:3s}.s3{animation-delay:6s}.s4{animation-delay:9s}.s5{animation-delay:12s}
      @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%{opacity:1;transform:translateY(0)}18%{opacity:1;transform:translateY(0)}22%{opacity:0;transform:translateY(-6px)}100%{opacity:0}}
      .cur{fill:#60a5fa;animation:blink 1s steps(2,start) infinite}
      @keyframes blink{to{visibility:hidden}}
      .node{fill:#60a5fa;opacity:.8}
    </style>
  </defs>
  <rect width="1000" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="18" fill="url(#grid)"/>
  <circle cx="160" cy="70" r="150" fill="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;560 80;0 0" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle cx="860" cy="220" r="130" fill="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-520 -70;0 0" dur="20s" repeatCount="indefinite"/>
  </circle>
  <!-- red neuronal de fondo -->
  <g stroke="#60a5fa" stroke-opacity="0.22" stroke-width="1">
    <line x1="60" y1="60" x2="150" y2="130"/><line x1="150" y1="130" x2="70" y2="210"/>
    <line x1="150" y1="130" x2="240" y2="70"/><line x1="240" y1="70" x2="300" y2="190"/>
    <line x1="940" y1="70" x2="850" y2="140"/><line x1="850" y1="140" x2="930" y2="215"/>
    <line x1="850" y1="140" x2="760" y2="60"/><line x1="760" y1="60" x2="700" y2="200"/>
  </g>
  <g class="node">
    <circle cx="60" cy="60" r="4"><animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="130" r="5"><animate attributeName="r" values="4;7;4" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="210" r="4"><animate attributeName="r" values="3;6;3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="70" r="4"><animate attributeName="r" values="3;6;3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="190" r="4"><animate attributeName="r" values="3;6;3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="70" r="4"><animate attributeName="r" values="3;6;3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="140" r="5"><animate attributeName="r" values="4;7;4" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="215" r="4"><animate attributeName="r" values="3;6;3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="60" r="4"><animate attributeName="r" values="3;6;3" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="200" r="4"><animate attributeName="r" values="3;6;3" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>
  <text x="500" y="58" text-anchor="middle" class="mono tag">CEO · ARK DEV</text>
  <text x="500" y="140" text-anchor="middle" class="mono name">Joel Andrés C.</text>
  <g text-anchor="middle" class="mono">
    <text x="500" y="196" class="sub">Ingeniero Full-Stack</text>
    <text x="500" y="196" class="sub s2">Agentes de IA · Era agéntica</text>
    <text x="500" y="196" class="sub s3">Apps web con IA integrada</text>
    <text x="500" y="196" class="sub s4">Ciberseguridad &amp; criptografía</text>
    <text x="500" y="196" class="sub s5">Fundador &amp; CEO @ ARK DEV</text>
  </g>
  <rect x="496" y="218" width="8" height="3" rx="1.5" class="cur"/>
</svg>
